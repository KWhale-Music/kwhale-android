name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.APPS_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "APPS_KEYSTORE_BASE64 secret is not configured" >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/apps-release.jks"

      - name: Build signed release APK
        env:
          APPS_STORE_PASSWORD: ${{ secrets.APPS_STORE_PASSWORD }}
          APPS_KEY_ALIAS: ${{ secrets.APPS_KEY_ALIAS }}
          APPS_KEY_PASSWORD: ${{ secrets.APPS_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease --no-daemon \
            -PAPPS_KEYSTORE="$RUNNER_TEMP/apps-release.jks" \
            -PAPPS_STORE_PASSWORD="$APPS_STORE_PASSWORD" \
            -PAPPS_KEY_ALIAS="$APPS_KEY_ALIAS" \
            -PAPPS_KEY_PASSWORD="$APPS_KEY_PASSWORD"

      - name: Verify APK signature
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kwhale-android-${{ github.ref_name }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
